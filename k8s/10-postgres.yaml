# PostgreSQL: una instancia con una base de datos POR microservicio, que es lo
# que exige el enunciado ("cada uno con su propia base de datos"). El aislamiento
# de esquema es real; compartir el motor solo ahorra recursos en el clúster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: parqueadero
data:
  # Se ejecuta una única vez, cuando el volumen está vacío.
  init.sql: |
    CREATE DATABASE usuarios_db;
    CREATE DATABASE vehiculos_db;
    CREATE DATABASE tickets_db;
    CREATE DATABASE db_audit;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: parqueadero
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: parqueadero
  labels:
    app: postgres
    app.kubernetes.io/part-of: parqueadero-saas
spec:
  serviceName: postgres
  # Las bases de datos NO escalan horizontalmente con réplicas simples: cada
  # réplica montaría el mismo PVC RWO. El escalado horizontal del enunciado
  # aplica a los microservicios (ver 60-hpa.yaml), no al motor de datos.
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: parqueadero-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: parqueadero-secrets
                  key: POSTGRES_PASSWORD
            # El initdb escribe en el subdirectorio, no en la raíz del volumen:
            # en muchos StorageClass la raíz trae un lost+found que hace fallar
            # a initdb con "directory not empty".
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # timeoutSeconds explícito: igual que en rabbitmq (ver 13-rabbitmq.yaml),
          # el default de 1s hace que pg_isready venza por simple contención de
          # CPU del nodo, no porque Postgres esté caído, y el kubelet lo mata.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
