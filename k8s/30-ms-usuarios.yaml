# MS-Usuarios: usuarios, roles, tenants y emisión de JWT (Spring Boot).
# Es el emisor de los tokens que validan todos los demás servicios y Kong.
apiVersion: v1
kind: Service
metadata:
  name: usuarios
  namespace: parqueadero
  labels:
    app: usuarios
spec:
  type: ClusterIP
  selector:
    app: usuarios
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios
  namespace: parqueadero
  labels:
    app: usuarios
    app.kubernetes.io/part-of: parqueadero-saas
spec:
  # 1 réplica en el clúster de demo: el nodo de minikube solo tiene ~3 GiB
  # reales y con 2 réplicas (512Mi de request cada una) el scheduler admitía
  # más memoria de la que cabe, el cgroup mataba procesos (exit 137) y el nodo
  # entraba en NodeNotReady arrastrando a etcd y al apiserver.
  replicas: 1
  selector:
    matchLabels:
      app: usuarios
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: usuarios
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: usuarios
          image: ghcr.io/mishellcuasquer/parking-piii/ms-usuarios:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/usuarios_db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: DB_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: JWT_SECRET }
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: RABBITMQ_USER }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: RABBITMQ_PASSWORD }
          envFrom:
            - configMapRef:
                name: parqueadero-config
          # Sondas TCP: los servicios no exponen /actuator/health y cualquier
          # ruta HTTP real devolvería 401 (todo pasa por el filtro JWT), lo que
          # dejaría al pod eternamente "not ready".
          # Spring Boot en este host puede tardar >100s solo en levantar el
          # contexto (ver logs: "Root WebApplicationContext: initialization
          # completed in 81741 ms"). El startupProbe es la forma correcta de
          # cubrirlo: mientras no pase, el kubelet NO ejecuta liveness ni
          # readiness, así que un arranque lento ya no puede matar al pod.
          # Presupuesto: 30 x 10s = 300s.
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          # Sin initialDelay: el startupProbe ya garantizó que arrancó.
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
