# Dashboard de monitoreo: vista global de ocupación (HTML estático).
# Consume los GET públicos de /api/zonas y /api/espacios a través de Kong, sin
# token, por eso no depende del login ni de un tenant concreto.
apiVersion: v1
kind: Service
metadata:
  name: monitoreo
  namespace: parqueadero
  labels:
    app: monitoreo
spec:
  type: ClusterIP
  selector:
    app: monitoreo
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoreo
  namespace: parqueadero
  labels:
    app: monitoreo
    app.kubernetes.io/part-of: parqueadero-saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoreo
  template:
    metadata:
      labels:
        app: monitoreo
    spec:
      containers:
        - name: monitoreo
          image: ghcr.io/mishellcuasquer/parking-piii/monitoreo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID"]
