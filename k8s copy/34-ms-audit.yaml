# MS-Auditoría (NestJS + PostgreSQL).
# No publica: solo consume `queue_audit` de RabbitMQ y persiste la trazabilidad.
apiVersion: v1
kind: Service
metadata:
  name: ms-audit
  namespace: parqueadero
  labels:
    app: ms-audit
spec:
  type: ClusterIP
  selector:
    app: ms-audit
  ports:
    - name: http
      port: 3004
      targetPort: 3004
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-audit
  namespace: parqueadero
  labels:
    app: ms-audit
    app.kubernetes.io/part-of: parqueadero-saas
spec:
  # Varias réplicas son consumidores en competencia sobre la MISMA cola: cada
  # evento lo procesa exactamente un pod, así que escalar aquí aumenta el
  # rendimiento de ingesta sin duplicar registros de auditoría.
  replicas: 2
  selector:
    matchLabels:
      app: ms-audit
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ms-audit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: ms-audit
          image: ghcr.io/mishellcuasquer/parking-piii/ms-audit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: HOME
              value: /tmp
            - name: DB_NAME
              value: db_audit
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: DB_PASSWORD }
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: RABBITMQ_USER }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: parqueadero-secrets, key: RABBITMQ_PASSWORD }
          envFrom:
            - configMapRef:
                name: parqueadero-config
          readinessProbe:
            tcpSocket:
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 3004
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
