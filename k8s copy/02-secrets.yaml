# Credenciales de la plataforma.
#
# ATENCIÓN: los valores de este archivo son los MISMOS de desarrollo que ya usa
# docker-compose.yml, y están aquí para que `kubectl apply -f k8s/` funcione de
# principio a fin en un clúster local (minikube/kind).
#
# En un clúster real NO se aplica este archivo: se crean los Secrets fuera de
# git (ver k8s/README.md, sección "Secrets en producción"), por ejemplo:
#
#   kubectl -n parqueadero create secret generic parqueadero-secrets \
#     --from-literal=DB_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" ... \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# El pipeline de despliegue (.github/workflows/deploy-k8s.yml) los inyecta desde
# los GitHub Secrets del repositorio y omite este archivo.
apiVersion: v1
kind: Secret
metadata:
  name: parqueadero-secrets
  namespace: parqueadero
  labels:
    app.kubernetes.io/part-of: parqueadero-saas
type: Opaque
stringData:
  # PostgreSQL (usuarios_db, vehiculos_db, tickets_db, db_audit)
  DB_USER: "postgres"
  DB_PASSWORD: "123"
  POSTGRES_PASSWORD: "123"

  # MySQL (zonas_espacios)
  MYSQL_USER: "root"
  MYSQL_PASSWORD: "123"
  MYSQL_ROOT_PASSWORD: "123"

  # RabbitMQ
  RABBITMQ_USER: "admin"
  RABBITMQ_PASSWORD: "admin123"

  # Firma de los JWT: debe ser IDÉNTICA en usuarios, zonas, vehículos y tickets,
  # porque todos validan el mismo token emitido por ms-usuarios.
  JWT_SECRET: "miClaveSecretaSuperSeguraParaJWT123456789"

  # Cuenta de servicio para las llamadas máquina-a-máquina (rol SERVICE)
  SERVICE_USERNAME: "service"
  SERVICE_PASSWORD: "service123"
