# Configuración para el Automatic Analysis de SonarCloud (se lee desde la raíz
# del repo). Excluye el boilerplate generado por NestJS que es idéntico entre
# microservicios y dispara la métrica de duplicación (eslint.config.mjs y los
# tests e2e de plantilla), además de artefactos de build.
#
# Se mantiene alineado con ParkingApp/sonar-project.properties, que es el que
# usa el análisis del CI: si el AutoScan se llegara a activar, no debe reportar
# duplicaciones que el análisis del pipeline ya considera aceptadas.
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/coverage/**,**/eslint.config.mjs,**/test/app.e2e-spec.ts
sonar.cpd.exclusions=**/eslint.config.mjs,**/test/**,**/*.spec.ts,**/config/OpenApiConfig.java,**/audit/AuditPublisher.java,**/audit/RabbitConfig.java,**/audit/Outbox*.java,**/entities/outbox-event.entity.ts,**/event-publisher.service.ts
