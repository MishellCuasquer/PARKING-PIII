name: Docker build & publish

# Construye y publica en GitHub Container Registry (ghcr.io) las imágenes de
# TODOS los componentes: los 5 microservicios, el frontend, el dashboard de
# monitoreo, el API Gateway y el broker de mensajes.
#
# En pull request solo se construye (validación de que los Dockerfiles siguen
# siendo correctos); el push al registro ocurre únicamente en main.

on:
  push:
    branches: [main]
    paths:
      - "ParkingApp/**"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "ParkingApp/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr.io exige el namespace en minúsculas; el repo es MishellCuasquer/PARKING-PIII.
  IMAGE_PREFIX: ghcr.io/mishellcuasquer/parking-piii

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Un Dockerfile roto no debe impedir ver si los demás compilan.
      fail-fast: false
      matrix:
        include:
          - name: ms-usuarios
            context: ParkingApp/App/ms-usuarios-roles-auth/usuarios
            dockerfile: ParkingApp/App/ms-usuarios-roles-auth/usuarios/Dockerfile
          - name: ms-zonas-espacios
            context: ParkingApp/App/ms-zonas-espacios/zonas-espacios
            dockerfile: ParkingApp/App/ms-zonas-espacios/zonas-espacios/Dockerfile
          - name: ms-vehiculos
            context: ParkingApp/App/ms-vehiculos
            dockerfile: ParkingApp/App/ms-vehiculos/Dockerfile
          - name: ms-tickets
            context: ParkingApp/App/ms-tickets
            dockerfile: ParkingApp/App/ms-tickets/Dockerfile
          - name: ms-audit
            context: ParkingApp/ms-audit
            dockerfile: ParkingApp/ms-audit/Dockerfile
          - name: frontend
            context: ParkingApp/Frontend
            dockerfile: ParkingApp/Frontend/Dockerfile
          - name: monitoreo
            context: ParkingApp/monitoreo
            dockerfile: ParkingApp/monitoreo/Dockerfile
          # Kong y RabbitMQ se construyen desde ParkingApp/ porque necesitan
          # archivos que viven fuera de su propia carpeta (App/kong.yml).
          - name: kong
            context: ParkingApp
            dockerfile: ParkingApp/docker/kong/Dockerfile
          - name: rabbitmq
            context: ParkingApp
            dockerfile: ParkingApp/docker/rabbitmq/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # En pull request no hay push, así que tampoco hace falta login (y los
        # PR desde forks no tienen permiso de packages).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos y tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caché en el propio registro de Actions: sin esto cada build de los
          # servicios Java rehace la descarga completa de dependencias Maven.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Resumen único para que la notificación de Telegram informe de un solo
  # resultado en vez de nueve.
  summary:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resultado del build de imágenes
        run: |
          echo "Resultado del job de build: ${{ needs.build.result }}"
          if [ "${{ needs.build.result }}" != "success" ]; then
            exit 1
          fi
