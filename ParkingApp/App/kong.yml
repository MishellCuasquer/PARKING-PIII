_format_version: "3.0"

# ---------------------------------------------------------------------------
# Consumidores y credenciales JWT
# ---------------------------------------------------------------------------
# Kong valida los tokens que emite ms-usuarios. El plugin `jwt` empareja el
# claim `iss` del token con el campo `key` de la credencial, así que hay una
# credencial por cada valor posible de JWT_ISSUER:
#   - http://localhost:8080           -> docker-compose / desarrollo
#   - https://parqueadero.espe.edu.ec -> Kubernetes (ver k8s/01-configmap.yaml)
# Ambas comparten el mismo secreto HS256 porque es el mismo emisor.
consumers:
  - username: parqueadero-usuarios
    jwt_secrets:
      - key: http://localhost:8080
        algorithm: HS256
        secret: miClaveSecretaSuperSeguraParaJWT123456789
      - key: https://parqueadero.espe.edu.ec
        algorithm: HS256
        secret: miClaveSecretaSuperSeguraParaJWT123456789

# ---------------------------------------------------------------------------
# Plugins globales
# ---------------------------------------------------------------------------
plugins:
  # Rate limiting exigido por el enunciado. `policy: local` = contador por pod;
  # con varias réplicas de Kong el límite efectivo se multiplica por el número
  # de réplicas. Es deliberado: un contador compartido en Redis añadiría una
  # dependencia dura del gateway a Redis, y aquí prima que el gateway nunca
  # deje de enrutar. Los límites son altos a propósito para no ahogar al SSE
  # ni al dashboard de monitoreo, que refresca en bucle.
  - name: rate-limiting
    config:
      minute: 600
      hour: 20000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  # Trazabilidad extremo a extremo: cada petición entra con un X-Correlation-ID
  # que viaja al microservicio y vuelve al cliente. Es la pieza que permite
  # cruzar un evento de auditoría con la petición HTTP que lo originó.
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid#counter
      echo_downstream: true

  # Transformación de solicitudes: marca el origen para que los microservicios
  # puedan distinguir el tráfico que entró por el gateway del que llegó
  # directo (llamadas internas entre servicios dentro del clúster).
  - name: request-transformer
    config:
      add:
        headers:
          - "X-Gateway:kong"

  # El SPA se sirve desde el mismo origen (nginx hace de proxy), pero el
  # dashboard de monitoreo y las herramientas de prueba sí llaman a Kong
  # cross-origin.
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Tenant-Id
        - X-Correlation-ID
      exposed_headers:
        - X-Correlation-ID
      credentials: false
      max_age: 3600

# ---------------------------------------------------------------------------
# Servicios y rutas
# ---------------------------------------------------------------------------
services:
  - name: ms-usuarios-roles-auth
    url: http://usuarios:8080
    routes:
      # OJO: esta ruta NO lleva el plugin `jwt`. Contiene endpoints que tienen
      # que ser públicos (login, /api/oauth/token, registro y el selector de
      # empresas del formulario de registro). El control fino de quién puede
      # hacer qué lo hace SecurityConfig del microservicio.
      - name: usuarios-route
        paths:
          - /api/users
          - /api/auth
          - /api/oauth
          - /api/personas
          - /api/roles
          - /api/tenants
        strip_path: false
    plugins:
      # Límite más estricto en el servicio que expone el login: es el único
      # endpoint público donde tiene sentido un ataque de fuerza bruta.
      # Al declararse a nivel de servicio sustituye al rate-limiting global.
      - name: rate-limiting
        config:
          minute: 120
          hour: 3000
          policy: local
          fault_tolerant: true

  - name: ms-zonas-espacios
    url: http://zonas-espacios:8081
    routes:
      # response_buffering: false en TODA la ruta: el stream SSE
      # /api/espacios/stream comparte el prefijo /api/espacios y Kong a veces
      # lo enruta por aquí; con buffering los eventos jamás llegan al cliente.
      # Para las respuestas JSON normales desactivar el buffering es inocuo.
      #
      # Tampoco lleva `jwt`: GET /api/zonas y GET /api/espacios son públicos a
      # propósito (alimentan el dashboard de monitoreo sin token).
      - name: zonas-route
        paths:
          - /api/zonas
          - /api/espacios
        strip_path: false
        response_buffering: false
      - name: espacios-stream-route
        paths:
          - /api/espacios/stream
        strip_path: false
        response_buffering: false

  - name: ms-vehiculos
    url: http://vehiculos:3000
    routes:
      - name: vehiculos-route
        paths:
          - /vehiculos
        strip_path: false
        plugins:
          # Todo /vehiculos exige token (JwtAuthGuard + RolesGuard en el
          # controlador), así que el gateway puede rechazar el tráfico anónimo
          # antes de que llegue al microservicio.
          - name: jwt
            config:
              claims_to_verify:
                - exp
              key_claim_name: iss
              run_on_preflight: false

  - name: ms-tickets
    url: http://tickets:3002
    routes:
      - name: tickets-route
        paths:
          - /tickets
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              key_claim_name: iss
              run_on_preflight: false

  - name: ms-audit
    url: http://ms-audit:3004
    routes:
      - name: audit-route
        paths:
          - /api/audit
        strip_path: false
        plugins:
          # El historial de auditoría es el dato más sensible del sistema y
          # ms-audit no tiene guard propio: aquí el gateway es la única barrera.
          - name: jwt
            config:
              claims_to_verify:
                - exp
              key_claim_name: iss
              run_on_preflight: false
