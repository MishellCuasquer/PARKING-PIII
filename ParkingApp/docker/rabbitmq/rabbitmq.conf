# Configuración del broker de eventos de ParkingApp.
# Las credenciales NO van aquí: llegan por RABBITMQ_DEFAULT_USER/PASS desde el
# Secret de Kubernetes (o desde docker-compose en local).

# Escuchar en todas las interfaces del pod/contenedor.
listeners.tcp.default = 5672

# Consola de administración (usuario/clave = los del Secret).
management.tcp.port = 15672

# Métricas Prometheus.
prometheus.tcp.port = 15692

# A partir del 70% de la RAM del contenedor RabbitMQ aplica contrapresión a los
# publicadores en vez de morir por OOM. Con el límite de 1Gi del StatefulSet eso
# son ~700Mi, muy por encima de lo que ocupa el flujo de auditoría.
vm_memory_high_watermark.relative = 0.7

# Corta conexiones muertas en 60s. Importante en Kubernetes: cuando un pod de un
# microservicio se reinicia, su conexión queda colgada del lado del broker.
heartbeat = 60

# Sin esto, un log por cada conexión ahoga la salida en un clúster con HPA.
log.console.level = warning
